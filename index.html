<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="text-center text-primary bg-light">Student Grade Management System</h1>
  <div class="container mt-5">

<!--student form-->
        <div class="form-box">
            <h2 class="text-primary text-center">Add Student Details and Subject Marks</h2>

            <form id="studentForm">
             <!-- Student Name -->
                <div class="form-group full-width">
                    <label for="Name">Student Name:</label>
                    <input type="text" id="Name" name="Name" placeholder="Enter student name"required>
                </div>

                <!-- Math -->
                <div class="form-group">
                    <label for="Math">Math:</label>
                    <input type="number" id="Math" name="Math" min="0" max="100" placeholder="0 - 100" required>
                </div>

                <!-- Science -->
                <div class="form-group">
                    <label for="Science">Science:</label>
                    <input  type="number" id="Science" name="Science" min="0" max="100" placeholder="0 - 100" required>
                </div>

                <!-- English -->
                <div class="form-group">
                    <label for="English">English:</label>
                    <input type="number" id="English" name="English" min="0" max="100" placeholder="0 - 100" required>
                </div>

                <!-- History -->
                <div class="form-group">
                    <label for="History">History:</label>
                    <input  type="number" id="History" name="History" min="0" max="100"placeholder="0 - 100" required>
                </div>

                <!-- Button -->
                <div class="form-group d-grid full-width">
                    <button type="submit" class="btn btn-primary" >
                        Add Student
                    </button>
                </div>

            </form>
            

        </div>

  <!--filter form--> 
  <div class="container mt-5">
  <div class="form-box">


    <h3>Filter Students</h3>

    <!-- Grade -->
    <label for="gradeFilter">Grade:</label>

    <select id="gradeFilter" class="form-select">
        <option value="all">All</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="Fail">Fail</option>
    </select>


    <!-- Average -->
    <label for="averageFilter" class="mt-3">
        Minimum Average:
    </label>

    <input
        type="number"
        id="averageFilter"
        class="form-control"
        placeholder="Enter minimum average"
        min="0"
        max="100"
    >


    <!-- Buttons -->
    <button
        type="button"
        class="btn btn-primary mt-3"
        onclick="filterStudents()">
        Apply Filter
    </button>

    <button
        type="button"
        class="btn btn-secondary mt-3"
        onclick="clearFilters()">
        Clear Filter
    </button>
</div>
  </div>
  
  <!-- Export and Download Buttons -->
  <div class="form-box">
  <div class="text-center mt-3">

    <button
        type="button"
        class="btn btn-success"
        onclick="exportStudents()">
        Export CSV
    </button>
<br><br>
    <button
        type="button"
        class="btn btn-info"
        onclick="downloadReport()">
        Download Report
    </button>

</div>
</div>

</div>
        <!-- table to display students -->
        <div id="tableContainer" class="mt-5">

        </div>
  </div>
  <div id="statisticsContainer" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="script.js"></script>
</body>
</html>
